<title>Solution Delivery Queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Ubuntu+Mono:wght@400;700&display=swap">
<style>
/* Layout: LFZ portal shell. White sidebar with the master logo and section nav, white top bar, light grey work area with white cards.
   Brand: LFZ Navy primary, LFZ Scarlet used sparingly for alerts and the brand leaf marker, Ubuntu throughout.
   Single light theme by choice, matching the LFZ portal and the guide's preference for the full-colour logo on white. */
:root{
  color-scheme:light;
  --navy:#001a4f; --dark-blue:#000f29; --scarlet:#f51f00; --salmon:#fcc5bd; --salmon-tint:#fee9e5; --grey:#696969; --grey-light:#afafaf;
  --bg:#F3F4F7; --surface:#FFFFFF; --sunk:#EEF1F6; --ink:var(--dark-blue); --muted:#5F6470; --line:#E2E6EE;
  --accent:var(--navy); --accent-ink:#FFFFFF; --accent-soft:#E7ECF5;
  --good:#22714A; --good-soft:#E1F2E8; --warn:#9C5A00; --warn-soft:#FDF0DC; --bad:#C81A00; --bad-soft:var(--salmon-tint);
  --p-uiux:#7D8DBA; --p-development:#001a4f; --p-qa:#3F67B0; --p-uat:#F2836F; --p-deploy:#696969;
  --shadow-card:0 1px 2px rgba(0,26,79,.06), 0 4px 16px rgba(0,26,79,.05);
  --shadow:0 12px 40px rgba(0,15,41,.22);
  --f-display:"Ubuntu", "Segoe UI", system-ui, sans-serif;
  --f-body:"Ubuntu", "Segoe UI", system-ui, sans-serif;
  --f-mono:"Ubuntu Mono", ui-monospace, Consolas, monospace;
  --side-w:272px;
}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.03em;color:var(--ink)}
h1{font-size:2.4rem;font-weight:700;line-height:1.1}
h2{font-size:1.2rem;font-weight:500}
h3{font-size:1rem;font-weight:700}
a{color:var(--navy)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}

/* shell */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding-inline:14px;padding-block:20px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding-inline:10px;padding-bottom:28px}
.brand img{display:block;height:46px;width:auto}
.navlabel{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-inline:10px;margin:18px 0 8px}
nav.tabs{display:flex;flex-direction:column;gap:2px}
nav.tabs button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:10px 12px;font:400 .98rem var(--f-body);color:var(--ink);cursor:pointer;position:relative}
nav.tabs button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button:hover{background:var(--sunk)}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--navy);font-weight:700}
nav.tabs button[aria-selected="true"]::before{content:"";position:absolute;left:-2px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--navy)}
nav.tabs .sep{height:1px;background:var(--line);margin:10px 10px}
.side-foot{margin-top:28px;padding-inline:10px;font-size:.75rem;color:var(--muted)}
.side-foot strong{color:var(--navy);font-weight:500}

.content{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-inline:28px;padding-block:12px;min-height:64px;flex-wrap:wrap}
.topbar .crumb{font-size:1.3rem;font-weight:500;letter-spacing:-.02em}
.wrap{width:100%;max-width:1320px;padding-inline:28px;padding-block:32px 72px}
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px}
.hero .sub{color:var(--muted);font-size:1rem;margin:0;max-width:62ch}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:14px 8px}
  .brand{padding-bottom:10px}
  .brand img{height:36px}
  .navlabel,.side-foot,nav.tabs .sep{display:none}
  nav.tabs{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:6px}
  nav.tabs button{width:auto;white-space:nowrap;padding:8px 12px;font-size:.9rem}
  nav.tabs button[aria-selected="true"]::before{left:12px;right:12px;top:auto;bottom:2px;width:auto;height:3px}
  .topbar{position:static;padding-inline:16px}
  .wrap{padding-inline:16px;padding-block:20px 56px}
  h1{font-size:1.8rem}
}

/* brand leaf: the guide's bullet form */
.leaf{display:inline-block;width:12px;height:10px;background:var(--scarlet);border-top-left-radius:100% 100%;transform:skewX(-14deg);flex:none}

button,.btn{font:500 .9rem var(--f-body);border-radius:8px;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--accent-ink)}
.btn.primary:hover{background:#062766}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--scarlet) 45%,var(--line))}
.btn.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--salmon-tint);color:var(--ink);border:1px solid var(--salmon);padding:12px 16px;border-radius:12px;margin-top:20px}

.strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin-top:28px}
.strip .cell{background:var(--surface);border-radius:12px;box-shadow:var(--shadow-card);padding:16px 18px;min-width:0}
.strip .n{font:700 1.9rem/1.1 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:6px;color:var(--navy)}
.strip .cell.alert .n{color:var(--scarlet)}
.strip .cell.owner .n{color:var(--warn)}
@media (max-width:1100px){.strip{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:440px){.strip{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}

section.block{margin-top:36px}
.block-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.block-head p{margin:3px 0 0;color:var(--muted);font-size:.86rem}
select,input,textarea{font:400 .92rem var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 11px;width:100%}
textarea{min-height:76px;resize:vertical}
select.inline{width:auto}

.tablebox{overflow-x:auto;background:var(--surface);border-radius:12px;box-shadow:var(--shadow-card)}
table{border-collapse:collapse;width:100%;min-width:760px}
th{font:500 .72rem var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer}
tbody tr.row:hover{background:var(--sunk)}
td.pos{font:700 1.1rem var(--f-display);font-variant-numeric:tabular-nums;width:52px;color:var(--navy)}
.sol-title{font-weight:500;color:var(--ink)}
.sol-id{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:500;padding:3px 10px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--ink)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.85}
.chip.build{background:var(--accent-soft);color:var(--navy)}
.chip.owner{background:var(--warn-soft);color:var(--warn)}
.chip.done{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.tag{display:inline-block;font-size:.7rem;font-weight:500;padding:1px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.bad{color:var(--bad);border-color:var(--salmon);background:var(--salmon-tint)}
.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}
.tag.it{color:var(--navy);border-color:color-mix(in srgb,var(--navy) 30%,var(--line))}
.flags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}

.empty{background:var(--surface);border-radius:12px;box-shadow:var(--shadow-card);padding:28px 24px;text-align:left}
.empty h2{margin-bottom:6px;font-weight:700}
.empty .row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

.flow{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:16px}
.flow .st{background:var(--surface);border-radius:12px;box-shadow:var(--shadow-card);padding:16px;min-width:0}
.flow .st .num{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding-inline:6px;border-radius:8px;background:var(--sunk);font:700 .8rem var(--f-body);color:var(--navy);margin-bottom:10px}
.flow .st p{margin:4px 0 0;color:var(--muted);font-size:.84rem}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,15,41,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(780px,100%);background:var(--bg);z-index:21;box-shadow:var(--shadow);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-in{padding-inline:24px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
.dhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;background:var(--surface);margin:-20px -24px 0;padding:20px 24px;border-bottom:1px solid var(--line)}
.dhead h2{font-weight:700;letter-spacing:-.03em}
.dhead .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;color:var(--muted);font-size:.86rem}
.x{background:var(--surface);border:1px solid var(--line);color:var(--ink);width:36px;height:36px;border-radius:8px;font-size:1.15rem;flex:none}
.card{background:var(--surface);border-radius:12px;box-shadow:var(--shadow-card);padding:18px;min-width:0}
.card.next{box-shadow:var(--shadow-card), inset 3px 0 0 var(--navy)}
.card h3{margin-bottom:8px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.who{font-size:.7rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;opacity:.75}

.stepper{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px}
.stepper .s{flex:1 0 58px;min-width:58px}
.stepper .bar{height:6px;border-radius:3px;background:var(--line)}
.stepper .s.done .bar{background:var(--navy)}
.stepper .s.cur .bar{background:var(--scarlet)}
.stepper .s.halt .bar{background:var(--warn)}
.stepper .lbl{font-size:.68rem;color:var(--muted);margin-top:5px;line-height:1.25}
.stepper .s.cur .lbl{color:var(--ink);font-weight:700}

.form{display:grid;gap:12px;margin-top:12px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.form .two{grid-template-columns:1fr}}
.form label{display:grid;gap:4px;font-size:.84rem;font-weight:500}
.form .hint{font-weight:400;color:var(--muted);font-size:.78rem}
.radio{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-weight:400!important}
.radio input{width:auto;margin-top:3px}
.radio:has(input:checked){border-color:var(--navy);background:var(--accent-soft)}
.alloc{display:grid;grid-template-columns:minmax(0,1.3fr) 80px minmax(0,1.2fr);gap:8px;align-items:center}
.alloc .h{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
@media (max-width:520px){.alloc{grid-template-columns:minmax(0,1fr) 64px}.alloc .as{grid-column:1/-1}.alloc .h.as{display:none}}

.gantt{display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr);gap:8px 12px;align-items:center;margin-top:12px}
.gantt .track{position:relative;height:22px;background:var(--sunk);border-radius:5px}
.gantt .bar{position:absolute;top:3px;bottom:3px;border-radius:4px}
.gantt .bar.cur{outline:2px solid var(--scarlet);outline-offset:1px}
.gantt .today{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--scarlet)}
.gantt .pl{font-size:.84rem;min-width:0}
.gantt .pl .d{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:7px 12px;font-size:.9rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
@media (max-width:480px){.kv{grid-template-columns:1fr}.kv dd{margin-bottom:6px}}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:0}
.hist li{display:grid;grid-template-columns:100px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}
.hist .when{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.hist .note{color:var(--muted);font-size:.86rem;margin-top:2px;white-space:pre-wrap}
.status-line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.bugs{list-style:none;margin:8px 0 0;padding:0}
.bugs li{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.bugs li:first-child{border-top:0}

/* modal */
.modal{position:fixed;inset:0;display:grid;place-items:start center;z-index:30;overflow-y:auto;padding-inline:16px;padding-block:calc(40px + env(safe-area-inset-top,0px)) 40px;background:rgba(0,15,41,.45)}
.modal .card{width:min(640px,100%);box-shadow:var(--shadow)}
.modal .card h2{font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--dark-blue);color:#fff;padding:11px 18px;border-radius:10px;z-index:40;font-size:.9rem;max-width:calc(100% - 32px)}
.toast.err{background:var(--bad)}
.role{display:inline-flex;align-items:center;gap:8px;font-size:.84rem;font-weight:500;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.role::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--grey-light)}
.role.admin::before{background:var(--navy)}
.head-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.resform{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:8px;align-items:end;margin-bottom:12px}
@media (max-width:560px){.resform{grid-template-columns:1fr}}
.rules{display:grid;gap:14px}
.rules > h2{margin-bottom:-2px}
.rules .card p{margin:6px 0 0;color:var(--muted)}
.rules .card ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px;color:var(--muted)}
.rules .card li{display:flex;gap:10px;align-items:baseline}
.rules .card li::before{content:"";display:inline-block;width:11px;height:9px;background:var(--scarlet);border-top-left-radius:100% 100%;transform:skewX(-14deg);flex:none}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>

<script>
const DAY = 864e5;
const UAT_RESPONSE_DAYS = 5;

const PHASES = [
  {key:'uiux', label:'UI/UX design', days:5, stages:['uiux','user_verification','design_review'], assignee:''},
  {key:'development', label:'Development', days:10, stages:['development'], assignee:''},
  {key:'qa', label:'QA', days:3, stages:['qa'], assignee:'QA Agent'},
  {key:'uat', label:'UAT', days:5, stages:['uat_notice','uat','uat_review'], assignee:''},
  {key:'deploy', label:'Deployment & post-deployment review', days:5, stages:['deployment','post_deployment'], assignee:''},
];
const STEPS = ['Submitted','Scope review','Accepted & queued','Time & resources','UI/UX','User verification','Development','QA','UAT','Deployment','Post-deployment'];
const STAGE = {
  submitted:       {label:'Submitted',             step:0,  tone:'',      waiting:'IT',            lane:'intake'},
  scope_review:    {label:'Scope review',          step:1,  tone:'',      waiting:'IT',            lane:'intake'},
  queued:          {label:'Awaiting allocation',   step:3,  tone:'build', waiting:'IT + process owner', lane:'queue'},
  uiux:            {label:'UI/UX design',          step:4,  tone:'build', waiting:'IT (UI/UX)',    lane:'queue'},
  user_verification:{label:'User verification',    step:5,  tone:'owner', waiting:'Process owner', lane:'queue'},
  design_review:   {label:'Design disputed',       step:5,  tone:'bad',   waiting:'IT admin',      lane:'queue'},
  development:     {label:'Development',           step:6,  tone:'build', waiting:'IT (Dev)',      lane:'queue'},
  qa:              {label:'QA',                    step:7,  tone:'build', waiting:'QA Agent',      lane:'queue'},
  uat_notice:      {label:'UAT invite sent',       step:8,  tone:'owner', waiting:'Process owner', lane:'queue'},
  uat:             {label:'UAT in progress',       step:8,  tone:'owner', waiting:'Process owner', lane:'queue'},
  uat_review:      {label:'UAT disputed',          step:8,  tone:'bad',   waiting:'IT admin',      lane:'queue'},
  deployment:      {label:'Deployment',            step:9,  tone:'build', waiting:'IT',            lane:'queue'},
  post_deployment: {label:'Live · post-deployment',step:10, tone:'done',  waiting:'Users + IT',    lane:'queue'},
  returned:        {label:'Back with owner',       step:-1, tone:'owner', waiting:'Process owner', lane:'queue'},
  completed:       {label:'Completed',             step:11, tone:'done',  waiting:'—',             lane:'archive'},
  declined:        {label:'Declined',              step:-1, tone:'bad',   waiting:'—',             lane:'archive'},
};

const S = { mode:'loading', loaded:false, solutions:[], bugs:[], tab:'pipeline', openId:null, panel:null,
  dept:'all', me:null, user:null, isIT:true, draft:{}, lastOpenJson:'', resources:[], liveSol:[], liveCtrl:{}, liveBugs:[], liveRes:[] };
const IT_ROLES = ['IT','QA Agent','IT admin'];
/* Fields only IT admins can write. They live in ctrl/<solutionId>, which the access rules lock to Editors. */
const CTRL_KEYS = ['queueSeq','plan','deprioritizedCount','ownerReturnCount','itReworkCount','scopeLockedAt'];
const SKILLS = ['UI/UX designer','Developer','QA','DevOps / deployment','Business analyst','Project manager'];
let store = null, liveDb = null;

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v==null || v===false) continue;
    if (k==='class') el.className = v;
    else if (k==='text') el.textContent = v;
    else if (k==='style') el.setAttribute('style', v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k==='value') el.value = v;
    else el.setAttribute(k, v===true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)){
    if (kid==null || kid===false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const pad = (n,w=2) => String(n).padStart(w,'0');
const ymd = d => { const x=new Date(d); return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate()); };
const parseYmd = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, m-1, d); };
const startOfDay = d => { const x=new Date(d); x.setHours(0,0,0,0); return x; };
const isWeekend = d => d.getDay()===0 || d.getDay()===6;
function nextWorkday(d){ const x=new Date(d); while(isWeekend(x)) x.setDate(x.getDate()+1); return x; }
function addWorkdays(d, n){ const x=new Date(d); let left=n; while(left>0){ x.setDate(x.getDate()+1); if(!isWeekend(x)) left--; } return x; }
function workdaysAfter(a, b){ let n=0; const x=startOfDay(a); const end=startOfDay(b); while(x<end){ x.setDate(x.getDate()+1); if(!isWeekend(x)) n++; } return n; }
const fmtD = d => new Date(d).toLocaleDateString(undefined, {day:'numeric', month:'short'});
const fmtDY = d => new Date(d).toLocaleDateString(undefined, {day:'numeric', month:'short', year:'numeric'});
const daysSince = t => Math.floor((Date.now() - new Date(t).getTime())/DAY);
function nextMonday(){ const x=startOfDay(new Date()); do { x.setDate(x.getDate()+1); } while(x.getDay()!==1); return x; }
const isUrl = s => /^https?:\/\//i.test(String(s||'').trim());
function linkOrText(v){ if(!v) return h('span',{class:'muted',text:'—'}); return isUrl(v) ? h('a',{href:v.trim(),target:'_blank',rel:'noopener',text:v.trim()}) : h('span',{text:v}); }

function schedule(plan){
  if (!plan || !plan.start) return null;
  let cur = nextWorkday(parseYmd(plan.start));
  return PHASES.map(p => {
    const cfg = (plan.phases||{})[p.key] || {};
    const days = Math.max(1, Math.round(+cfg.days || p.days));
    const start = new Date(cur), end = addWorkdays(start, days-1);
    cur = addWorkdays(end, 1);
    return {...p, days, assignee: cfg.assignee || '', start, end};
  });
}
function phaseFor(stage){ return PHASES.find(p => p.stages.includes(stage)); }
function phaseStatus(s){
  const sch = schedule(s.plan), ph = phaseFor(s.stage);
  if (!sch || !ph) return null;
  const row = sch.find(r => r.key===ph.key);
  const today = startOfDay(new Date());
  const late = today > row.end ? workdaysAfter(row.end, today) : 0;
  return {row, late, golive: sch[sch.length-1].end};
}

/* ---------- derived ---------- */
function numbering(){
  const m = {}; [...S.solutions].sort((a,b)=>String(a.submittedAt).localeCompare(String(b.submittedAt))).forEach((s,i)=> m[s.id] = 'SOL-'+pad(i+1,3));
  return m;
}
function queueList(){
  return S.solutions.filter(s => STAGE[s.stage]?.lane==='queue' && s.queueSeq!=null).sort((a,b)=>a.queueSeq-b.queueSeq);
}
function positions(){ const m={}; queueList().forEach((s,i)=> m[s.id]=i+1); return m; }
function openBugs(){ return S.bugs.filter(b=>b.status!=='fixed').sort((a,b)=>String(a.reportedAt).localeCompare(String(b.reportedAt))); }
function uatDays(s){ return workdaysAfter(s.uatNotifiedAt, new Date()); }
function uatLapsed(s){ return s.stage==='uat_notice' && s.uatNotifiedAt && uatDays(s) >= UAT_RESPONSE_DAYS; }

/* ---------- stores ---------- */
function liveStore(db){
  return {
    addSolution: d => db.collection('solutions').add(d),
    apply: async (s, solP, ctrlP) => {
      if (Object.keys(ctrlP).length){
        const cur = {}; CTRL_KEYS.forEach(k => { if (s[k] !== undefined) cur[k] = s[k]; });
        await db.doc('ctrl/'+s.id).set({...cur, ...ctrlP});
      }
      await db.doc('solutions/'+s.id).update(solP);
    },
    addBug: d => db.collection('bugs').add(d),
    updateBug: (id,p) => db.doc('bugs/'+id).update(p),
    addResource: d => db.collection('resources').add(d),
    deleteResource: id => db.doc('resources/'+id).delete(),
  };
}
function mergeLive(){
  S.solutions = S.liveSol.map(s => {
    const base = {...s}; CTRL_KEYS.forEach(k => delete base[k]);
    const c = S.liveCtrl[s.id] || {}; const out = {...base, queueSeq:null};
    CTRL_KEYS.forEach(k => { if (c[k] !== undefined) out[k] = c[k]; });
    return out;
  });
  S.bugs = S.liveBugs; S.resources = S.liveRes;
}
function demoStore(){
  const id = () => 'demo'+Math.random().toString(36).slice(2,9);
  return {
    addSolution: async d => { S.solutions = [...S.solutions, {id:id(), ...d}]; afterData(); },
    apply: async (s, solP, ctrlP) => { S.solutions = S.solutions.map(x => x.id===s.id ? {...x, ...solP, ...ctrlP} : x); afterData(); },
    addResource: async d => { S.resources = [...S.resources, {id:id(), ...d}]; afterData(); },
    deleteResource: async rid => { S.resources = S.resources.filter(r => r.id!==rid); afterData(); },

function ev(action, note, extra){ return {at:new Date().toISOString(), by:S.me||null, action, note:note||'', ...(extra||{})}; }
function move(s, patch, event){
  const solP = {history:[...(s.history||[]), event]}, ctrlP = {};
  for (const [k,v] of Object.entries(patch)) (CTRL_KEYS.includes(k) ? ctrlP : solP)[k] = v;
  if (patch.stage && patch.stage !== s.stage) solP.stageSince = event.at;
  return store.apply(s, solP, ctrlP);
}
async function act(fn, ok){
  if (!store){ toast('The pipeline is still loading. Try again in a moment.', true); return false; }
  try { await fn(); if (ok) toast(ok); S.panel = null; S.draft = {}; renderDrawer(true); return true; }
  catch(e){
    const code = e && e.code;
    if (code==='invalid_argument') toast('This change was refused. Queue positions, timelines and resources can only be set by IT admins, and view-only users cannot make changes.', true);
    else if (code==='quota_exceeded') toast('The pipeline store is full. Ask the queue owner to archive old records.', true);
    else toast('Could not save the change. Check your connection and try again.', true);
    return false;
  }
}
function toast(msg, err){
  const r = $('#toast-root'); r.replaceChildren(h('div',{class:'toast'+(err?' err':''), role:'status', text:msg}));
  clearTimeout(toast.t); toast.t = setTimeout(()=> r.replaceChildren(), err ? 6000 : 2800);
}

          ()=>{ if(!req(['f-proto','f-note'])) return;
            act(()=>move(s,{stage:'queued', prototypeUrl:S.draft['f-proto'].trim(), plan:null}, ev('Revised prototype resubmitted by process owner', S.draft['f-note'].trim())),'Resubmitted'); }, 'Resubmit'));
      return card('Back with the process owner', 'The requirement was not captured correctly. Redo the prototype and resubmit. The solution stays at the bottom of the queue.',
        h('div',{class:'actions'}, btn('Resubmit revised prototype','Process owner', ()=>openPanel('resubmit'),'primary')));
    case 'completed': return card('Completed', s.completedAt ? 'Closed on '+fmtDY(s.completedAt)+'.' : null);
    case 'declined': return card('Declined by IT', s.declineReason || null);
  }
  return null;
}
function designReject(s){
  const note = S.draft['f-note'].trim();
  if (S.draft['f-fault']==='it') act(()=>move(s,{stage:'uiux', itReworkCount:(s.itReworkCount||0)+1}, ev('IT admin: design gap caused by IT — designer to fix, timeline unchanged', note, {fault:'IT'})),'Back to UI/UX. Timeline unchanged');
  else act(()=>move(s,{stage:'returned', returnedFrom:'user_verification', queueSeq:Date.now(), ownerReturnCount:(s.ownerReturnCount||0)+1, plan:null}, ev('IT admin: requirements not captured by process owner — sent back for prototype redo; moved to bottom of queue', note, {fault:'Process owner'})),'Sent back to the process owner');
}
function uatReject(s){
  const note = S.draft['f-note'].trim();
  if (S.draft['f-fault']==='it') act(()=>move(s,{stage:'development', itReworkCount:(s.itReworkCount||0)+1}, ev('IT admin: UAT deviation caused by IT — development to redo, timeline unchanged', note, {fault:'IT'})),'Back to development. Timeline unchanged');
  else act(()=>move(s,{stage:'returned', returnedFrom:'uat', queueSeq:Date.now(), ownerReturnCount:(s.ownerReturnCount||0)+1, plan:null}, ev('IT admin: UAT deviation came from process owner — sent back; moved to bottom of queue', note, {fault:'Process owner'})),'Sent back to the process owner');
}

function stepper(s){
  const cur = STAGE[s.stage]?.step ?? -1;
  const halted = s.stage==='returned' || s.stage==='declined';
  const reach = halted ? (s.stage==='declined' ? 1 : 3) : cur;
  return h('div',{class:'stepper', 'aria-label':'Progress'}, STEPS.map((t,i) => {
    let c = '';
    if (s.stage==='completed' || i < reach) c = 'done';
    else if (i===reach) c = halted ? 'halt' : 'cur';
    return h('div',{class:'s '+c}, h('div',{class:'bar'}), h('div',{class:'lbl', text:t}));
  }));
}
function planCard(s){
  const sch = schedule(s.plan);
  if (!sch) return h('div',{class:'card'}, h('h3',{text:'Time & resources'}), h('p',{class:'muted', style:'margin:0', text: s.stage==='returned' ? 'The previous plan was cancelled when this solution went back to the process owner. A new plan is agreed after resubmission.' : 'Not agreed yet. The plan is set after the solution is accepted and queued.'}));
  const t0 = sch[0].start.getTime(), t1 = sch[sch.length-1].end.getTime() + DAY, span = t1 - t0;
  const pct = t => Math.max(0, Math.min(100, (t - t0) / span * 100));
  const today = startOfDay(new Date()).getTime();
  const curPh = phaseFor(s.stage);
  const ps = phaseStatus(s);
  return h('div',{class:'card'},
    h('div',{class:'block-head', style:'margin:0'}, h('h3',{style:'margin:0', text:'Time & resources'}),
      h('span',{class:'small muted'}, 'Planned go-live ', h('strong',{class:'mono', text:fmtDY(sch[sch.length-1].end)}))),
    ps && ps.late ? h('div',{class:'status-line'}, h('span',{class:'tag bad', text:ps.row.label+' is '+ps.late+' working day'+(ps.late>1?'s':'')+' past its planned end'})) : null,
    h('div',{class:'gantt'}, sch.map(r => [
      h('div',{class:'pl'}, h('div',{style:'font-weight:500', text:r.label}), h('div',{class:'d', text:fmtD(r.start)+' – '+fmtD(r.end)+' · '+r.days+'d'+(r.assignee?' · '+r.assignee:'')})),
      h('div',{class:'track'},
        h('div',{class:'bar'+(curPh && curPh.key===r.key && STAGE[s.stage].lane==='queue' ? ' cur' : ''), style:'left:'+pct(r.start.getTime())+'%;width:'+(pct(r.end.getTime()+DAY)-pct(r.start.getTime()))+'%;background:var(--p-'+r.key+')'}),
        today>=t0 && today<=t1 ? h('div',{class:'today', title:'Today', style:'left:'+pct(today+DAY/2)+'%'}) : null)
    ])),
    h('p',{class:'small muted', style:'margin:10px 0 0', text:'Red line marks today. Rework caused by IT does not extend these dates.'}));
}
function renderDrawer(force){
  const s = S.solutions.find(x=>x.id===S.openId);
  const root = $('#drawer-root');
  if (!s){ if (S.openId) closeDrawer(); return; }
  const keepScroll = root.querySelector('.drawer')?.scrollTop || 0;
  S.lastOpenJson = JSON.stringify(s) + JSON.stringify(S.bugs.filter(b=>b.solutionId===s.id));
  const num = numbering(), pos = positions();
  const bugs = S.bugs.filter(b=>b.solutionId===s.id).sort((a,b)=>String(a.reportedAt).localeCompare(String(b.reportedAt)));
  const hist = [...(s.history||[])].reverse();
  const drawer = h('aside',{class:'drawer', role:'dialog', 'aria-modal':'true', 'aria-label':s.title},
    h('div',{class:'drawer-in'},
      h('div',{class:'dhead'},
        h('div',{style:'min-width:0'},
          h('div',{class:'sol-id', text:num[s.id]}),
          h('h2',{style:'font-size:1.35rem;margin-top:2px', text:s.title}),
          h('div',{class:'meta'},
            stageChip(s),
            pos[s.id] ? h('span',{}, 'Queue position ', h('strong',{class:'mono', text:'#'+pos[s.id]})) : h('span',{text: STAGE[s.stage].lane==='intake' ? 'Not queued yet' : ''}),
            h('span',{text:s.department||''}),
            h('span',{}, 'Waiting on ', h('strong',{text:STAGE[s.stage]?.waiting||''})))),
        h('button',{class:'x', type:'button', 'aria-label':'Close', onclick:closeDrawer, text:'×'})),
      stepper(s),
      nextStep(s),
      planCard(s),
      h('div',{class:'card'}, h('h3',{text:'Request & scope'}),
        h('dl',{class:'kv'},
          h('dt',{text:'Process owner'}), h('dd',{text:s.processOwner||'—'}),
          h('dt',{text:'Approved by'}), h('dd',{text:s.approvedBy||'—'}),
          h('dt',{text:'Submitted'}), h('dd',{}, fmtDY(s.submittedAt), s.submittedBy ? [' by ', nameSpan(s.submittedBy)] : null),
          h('dt',{text:'Problem / need'}), h('dd',{style:'white-space:pre-wrap', text:s.description||'—'}),
          h('dt',{text:'Prototype'}), h('dd',{}, linkOrText(s.prototypeUrl)),
          h('dt',{text:'BRD'}), h('dd',{}, linkOrText(s.brdUrl)),
          h('dt',{text:'Locked scope'}), h('dd',{style:'white-space:pre-wrap', text: s.scopeSummary ? s.scopeSummary : 'Not locked yet'}),
          s.scopeLockedAt ? [h('dt',{text:'Scope locked'}), h('dd',{class:'mono', text:fmtDY(s.scopeLockedAt)})] : null,
          h('dt',{text:'Rework'}), h('dd',{}, 'IT-caused: ', h('strong',{text:String(s.itReworkCount||0)}), ' · Owner-caused: ', h('strong',{text:String(s.ownerReturnCount||0)}), ' · Deprioritised: ', h('strong',{text:String(s.deprioritizedCount||0)})))),
      bugs.length ? h('div',{class:'card'}, h('h3',{text:'Bugs'}), h('ul',{class:'bugs'}, bugs.map(b => h('li',{},
        h('div',{style:'min-width:0'}, h('div',{style:'font-weight:500', text:b.title}), h('div',{class:'small muted', text:'Reported '+fmtD(b.reportedAt)+(b.reporter?' by '+b.reporter:'')})),
        b.status==='fixed' ? h('span',{class:'chip done', text:'Fixed'}) : S.isIT ? h('button',{class:'btn', type:'button', onclick:()=>fixBug(b), text:'Mark fixed'}) : h('span',{class:'chip', text:'Open'}))))) : null,
      h('div',{class:'card'}, h('h3',{text:'History'}),
        hist.length ? h('ul',{class:'hist'}, hist.map(e => h('li',{},
          h('div',{class:'when', text:fmtDY(e.at)}),
          h('div',{style:'min-width:0'},
            h('div',{}, e.action, ' ', e.fault ? h('span',{class:'tag '+(e.fault==='IT'?'it':'warn'), text:e.fault+' cause'}) : null),
            e.note ? h('div',{class:'note', text:e.note}) : null,
            h('div',{class:'small muted'}, e.by ? nameSpan(e.by) : (S.mode==='demo' ? 'Example' : ''))))))
        : h('p',{class:'muted', text:'No history yet.'}))));
  root.replaceChildren(h('div',{class:'scrim', onclick:closeDrawer}), drawer);
  document.body.style.overflow = 'hidden';
  drawer.scrollTop = force ? keepScroll : 0;
  fillNames(drawer);
}

/* ---------- submit modal ---------- */
function openSubmit(){
  S.draft = {};
  const close = () => { $('#modal-root').replaceChildren(); document.body.style.overflow = S.openId ? 'hidden' : ''; };
  const ids = ['n-title','n-dept','n-owner','n-approved','n-desc','n-proto'];
  const form = h('form',{class:'form', onsubmit:async e=>{ e.preventDefault();
      if (!req(ids)) return;
      const now = new Date().toISOString(), d = k => String(S.draft[k]||'').trim();
      const ok = await act(()=>store.addSolution({title:d('n-title'), department:d('n-dept'), processOwner:d('n-owner'), approvedBy:d('n-approved'), description:d('n-desc'), prototypeUrl:d('n-proto'),
        submittedAt:now, submittedBy:S.me||null, stage:'submitted', stageSince:now,
        history:[{at:now, by:S.me||null, action:'Submitted prototype', note:d('n-notes')}]}), 'Prototype submitted. IT will review the scope.');
      if (ok){ close(); setTab('pipeline'); } }},
    field('n-title','Solution name',{required:true, placeholder:'e.g. Vendor onboarding portal'}),
    h('div',{class:'two'}, field('n-dept','Department',{required:true}), field('n-owner','Process owner',{required:true, placeholder:'Your name'})),
    field('n-approved','Approved by (department)',{required:true, hint:'The department head who approved you as process owner for this request.'}),
    field('n-desc','What should the solution do?',{required:true, multi:true}),
    field('n-proto','Prototype location',{required:true, placeholder:'Link to Figma, a file, or a document reference'}),
    field('n-notes','Anything else IT should know',{multi:true}),
    h('div',{class:'actions', style:'margin-top:0'}, h('button',{class:'btn primary', type:'submit', text:'Submit prototype'}), h('button',{class:'btn', type:'button', onclick:close, text:'Cancel'})));
  $('#modal-root').replaceChildren(h('div',{class:'modal', onclick:e=>{ if(e.target.classList.contains('modal')) close(); }},
    h('div',{class:'card', role:'dialog', 'aria-modal':'true', 'aria-label':'Submit a prototype'},
      h('h2',{text:'Submit a prototype'}),
      h('p',{class:'muted', style:'margin:4px 0 0', text:'Submitting does not reserve a queue position. The solution is queued only when IT accepts it after scope review.'}),
      form)));
  document.body.style.overflow = 'hidden';
  $('#n-title').focus();
}

/* ---------- modes ---------- */
function enterDemo(){ const d = demoData(); S.mode='demo'; S.solutions=d.sols; S.bugs=d.bugs;
  S.resources = [['Designer 1','UI/UX designer'],['Designer 2','UI/UX designer'],['Dev team A','Developer'],['Dev team B','Developer'],['Dev team C','Developer'],['QA Agent','QA'],['Release engineer','DevOps / deployment']].map((r,i)=>({id:'dr'+i, name:r[0], skill:r[1]}));
  store = demoStore(); closeDrawer(); renderMain(); }
function goLive(){ S.mode='live'; mergeLive(); store = liveStore(liveDb); closeDrawer(); renderMain(); }
function renderRole(){
  const b = $('#role-badge');
  if (S.mode==='loading') { b.replaceChildren(); return; }
  const v = isViewer();
  $('#btn-submit').hidden = v;
  b.replaceChildren(h('span',{class:'role'+(S.isIT?' admin':''),
    title: S.isIT ? 'You have Editor access, so you act as IT admin.' : v ? 'You have view-only access.' : 'You act as a process owner.',
    text: S.isIT ? 'You: IT admin' : v ? 'You: Viewer' : 'You: Process owner'}));
}

async function boot(){
  document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', ()=>setTab(b.dataset.tab)));
  $('#btn-submit').addEventListener('click', openSubmit);
  document.addEventListener('keydown', e => { if (e.key==='Escape'){ if ($('#modal-root').firstChild){ $('#modal-root').replaceChildren(); document.body.style.overflow = S.openId?'hidden':''; } else if (S.openId) closeDrawer(); } });
  try { const t = localStorage.getItem('sdq-tab'); if (t && ['pipeline','it','bugs','rules'].includes(t)) S.tab = t; } catch(e){}
  document.querySelectorAll('nav.tabs button').forEach(b => { b.setAttribute('aria-selected', String(b.dataset.tab===S.tab)); if (b.dataset.tab===S.tab) $('#page-title').textContent = b.dataset.title; });
  renderMain();
  const c = window.claude;
  let db = null;
  if (c && c.use){
    try { db = await c.use('db'); } catch(e){}
    try { S.user = await c.use('user'); } catch(e){}
    if (S.user){ try { S.me = await S.user.id(); } catch(e){} try { S.isIT = await S.user.canEdit(); } catch(e){} try { const w = await S.user.can('data.write'); S.canWrite = w === false ? false : true; } catch(e){} }
  }
  if (!db){ S.isIT = true; enterDemo(); renderRole(); return; }
  liveDb = db; store = liveStore(db); S.mode = 'live';
  renderRole();
  const got = new Set();
  const sub = (name, assign, onErr) => db.collection(name).onSnapshot(snap => {
    assign(snap.docs); got.add(name);
    if (got.size === 4) S.loaded = true;
    if (S.mode==='live'){ mergeLive(); afterData(); }
  }, onErr || (() => {}));
  sub('solutions', docs => { S.liveSol = docs.map(d => ({id:d.id, ...d.data()})); }, () => toast('Lost the live connection to the pipeline. Reload the page.', true));
  sub('ctrl', docs => { const m = {}; docs.forEach(d => m[d.id] = d.data()); S.liveCtrl = m; });
  sub('bugs', docs => { S.liveBugs = docs.map(d => ({id:d.id, ...d.data()})); });
  sub('resources', docs => { S.liveRes = docs.map(d => ({id:d.id, ...d.data()})); });
}
boot();
</script>
